# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: market-regime-detection
    runtime: python
    plan: free
    # Precompute results and draw the charts during the build, so the page loads fast.
    buildCommand: pip install -r requirements.txt && python src/pipeline.py && python web/charts.py
    startCommand: uvicorn web.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: REPO_URL
        value: https://github.com/ashishhh2005/financial-market-regime-detection
